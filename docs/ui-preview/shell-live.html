<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>骨架实时验证台</title>
<!--
  ============================================================================
  骨架实时验证台 —— 用**真实前端产物**按三档视口并排渲染，一眼看出响应式对不对。

  用法（必须先有服务在跑，且必须同源才能读 iframe 的 computed 视口）：
    1) 构建并启动服务（注意 cwd 必须是 apps/web，见下面的坑）：
         pnpm --filter @bili23-web/web check
         cd apps/web ; $env:PORT="8799"; $env:BILI23_DATA_DIR="$env:TEMP\ui-check"; node dist/server/index.js
    2) 把这个文件复制成 apps/web/dist/client/_uicheck.html
    3) Chrome 截图（窗口开大，三个 iframe 是横向并排的）：
         chrome --headless=new --disable-gpu --hide-scrollbars --window-size=2800,1000 \
                --virtual-time-budget=20000 --user-data-dir=%TEMP%\p1 \
                --screenshot=out.png "http://127.0.0.1:8799/_uicheck.html"

  为什么用 iframe 而不是 --window-size：Chrome 窗口有最小宽度（实测 528px），窄档会被夹住，
  媒体查询按被夹后的宽度生效 —— 见 docs/parity/07-前端UI重做-设计稿.md §六。

  为什么把视口写进页眉：`--headless=new` 下 `--dump-dom` 实测**没有任何输出**（0 字节），
  读不回 innerWidth。写进页面后，**截图自己就是证据**。

  ⚠️ 坑：`apps/web/src/server/index.ts` 的静态目录是 `process.cwd() + "/dist/client"`。
  从仓库根跑 `node apps/web/dist/server/index.js` 时 `/api/*` 正常但 `/` 直接 404 —— cwd 必须是 apps/web。
  ============================================================================
-->
<style>
  html,body{margin:0;background:#2b2f36;color:#ddd;font:12px/1.4 monospace}
  body{display:flex;gap:10px;align-items:flex-start;padding:10px}
  iframe{border:0;background:#fff;display:block}
  #vps{position:fixed;left:0;top:0;right:0;z-index:9;background:#000;color:#0f0;padding:4px 8px;font:13px/1.3 monospace}
</style>
</head>
<body>
<div id="vps"></div>
<div style="height:28px"></div>
<script>
// 首屏绕过"接受条款"闸门；主题可用 ?theme=dark 切换
localStorage.setItem('bili23.web.accepted_terms', 'true');
localStorage.setItem('bili23.web.ui.theme', JSON.stringify(new URLSearchParams(location.search).get('theme') || 'light'));

const sizes = [[1440, 900], [900, 900], [375, 760]];
for (const [w, h] of sizes) {
  const f = document.createElement('iframe');
  f.width = w; f.height = h; f.src = '/';
  document.body.appendChild(f);
}

// 把每个 iframe 的**真实视口**写回标题与页眉，用来核对"截图宽度 == 页面以为的宽度"
function report() {
  const ws = [...document.querySelectorAll('iframe')].map((f) => {
    try { return f.contentWindow.innerWidth + 'x' + f.contentWindow.innerHeight; } catch { return 'X'; }
  });
  document.title = 'viewports ' + ws.join(' | ');
  document.getElementById('vps').textContent =
    'iframe 实际视口（期望 1440x900 | 900x900 | 375x760）:  #1=' + ws[0] + '  #2=' + ws[1] + '  #3=' + ws[2];
}
setInterval(report, 400);
report();
</script>
</body>
</html>
