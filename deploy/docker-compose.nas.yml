# bili23-web NAS 部署模板（正式模板：以本目录 deploy/ 为准，旧 apps/web/docker-compose.nas.yml 已删除）
#
# 部署目录约定：/volume1/docker/bili23-web/
#   deploy/   本文件 + .env.example + README.md
#   data/     容器 ./data 挂载目标（config.json / task.db / downloads）
#
# .env 用法：把 .env.example 复制为工程目录下的 .env 后按需修改（如 TZ/PORT/DOWNLOAD_DIR）。
# compose 用 ${VAR:-默认值} 语法读取；不建 .env 时全部使用下方默认值，可直接部署。
#
# 常用命令（工程目录 /volume1/docker/bili23-web 下执行）：
#   sudo docker compose --project-directory /volume1/docker/bili23-web \
#     -f deploy/docker-compose.nas.yml up -d
#   sudo docker compose --project-directory /volume1/docker/bili23-web \
#     -f deploy/docker-compose.nas.yml pull && ... up -d   # 更新镜像
services:
  bili23-web:
    image: ghcr.io/sakurachiyo0v0/bili23-web:latest
    container_name: bili23-web
    restart: unless-stopped
    ports:
      # 宿主 8788 → 容器 8787（与同机其它服务的 8787 错开）
      - "8788:8787"
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
      - PORT=${PORT:-8787}
      # 下载产物目录（容器内），随 ./data 落盘到宿主
      - DOWNLOAD_DIR=${DOWNLOAD_DIR:-/data/downloads}
      # 数据根目录（config.json / task.db / downloads），须与 volumes 的 /data 对应，通常不要改
      - BILI23_DATA_DIR=${BILI23_DATA_DIR:-/data}
      # **允许的存储范围**（`;` 分隔，留空=不限制）。目录选择器与下载目录都只能落在这里面。
      # /data 必须带上：容器里这个路径映射到宿主 /volume1/docker/bili23-web/deploy/data。
      - BILI23_ALLOWED_ROOTS=${BILI23_ALLOWED_ROOTS:-/data;/volume1;/home}
    volumes:
      # 容器 /data ↔ 宿主 ./data（工程目录下，即 /volume1/docker/bili23-web/deploy/data）
      - ./data:/data
      # 存储范围：把 /volume1 与 /home 暴露给容器（与上面的 BILI23_ALLOWED_ROOTS 对应）
      # ⚠️ /volume1 里含 /volume1/docker（本机其它服务的编排与数据），挂进来意味着**应用可写**它们；
      #    若只想暴露媒体目录，把下面两行换成具体共享路径即可。
      - /volume1:/volume1
      - /home:/home
      # 下载产物目录：宿主"共享文件夹"↔ 容器内 DOWNLOAD_DIR。
      # ⚠️ 必须显式写出来 —— 否则 `up -d` 重建容器时这条挂载会消失，
      #    产物列表会突然变空（实测踩到：从 9 条变 0 条；文件本身在宿主上没丢）。
      - ${DOWNLOAD_HOST_DIR:-/volume1/bili23-downloads}:/data/bili23-downloads
    labels:
      # watchtower 检测到 ghcr latest digest 变化后自动重建（需 watchtower 已运行）
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      # alpine 自带 busybox wget；/api/health 返回 200 即健康
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s