name: Build bili23-web image

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/engine/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "VERSION=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/sakurachiyo0v0/bili23-web:latest
            ghcr.io/sakurachiyo0v0/bili23-web:${{ steps.version.outputs.VERSION }}
            ghcr.io/sakurachiyo0v0/bili23-web:${{ github.sha }}
